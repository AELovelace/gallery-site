# Include inside the existing HTTPS server block for lidoll.dev on 10.1.1.20.
# The existing index/game routes and TLS certificate configuration stay in that block.
# install.sh renders the chosen port in /opt/lidoll-gallery/server/gallery/nginx-gallery.conf; copy that installed snippet for a custom port.
location = /gallery {
    return 308 /gallery/;
}

location ^~ /gallery/ {
    proxy_pass http://10.1.1.23:8787; # Preserves /gallery/ for the application's page, API, and media routes.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    client_max_body_size 1024m; # 1 GiB per file; install.sh renders the saved GALLERY_MAX_UPLOAD_MB value here.
    client_body_timeout 120s;
    proxy_request_buffering off; # Streams large videos directly to the service's temporary upload file.
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_cache off; # Keeps login sessions, collection changes, and deletions immediately visible.
}
